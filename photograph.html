<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photograph | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage scroll">
  <h1 class="page-title">PHOTOGRAPH</h1>
  <!-- 写真は photos フォルダに入れて、<figure><img src="photos/ファイル名" alt="説明"></figure> に置き換える -->
  <div class="gallery">
    <figure>01</figure>
    <figure>02</figure>
    <figure>03</figure>
    <figure>04</figure>
    <figure>05</figure>
    <figure>06</figure>
  </div>
</main>

<div class="lightbox" id="lightbox"><img alt=""></div>

<nav class="tabs">
  <a href="index.html">OPENING</a>
  <a href="about.html">ABOUT</a>
  <a href="works.html">WORKS</a>
  <a href="photograph.html" aria-current="page">PHOTOGRAPH</a>
  <a href="contact.html">CONTACT</a>
</nav>

<script src="app.js"></script>
<script>
  // 写真をクリックすると拡大表示、もう一度クリックで閉じる
  const box = document.getElementById("lightbox");
  document.querySelector(".gallery").addEventListener("click", (e) => {
    if (e.target.tagName !== "IMG") return;
    box.querySelector("img").src = e.target.src;
    box.classList.add("show");
  });
  box.addEventListener("click", () => box.classList.remove("show"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") box.classList.remove("show"); });
</script>
</body>
</html>
